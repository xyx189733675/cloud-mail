name: Check token fingerprint
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Print fingerprint
        run: |
          echo "token_len=${#CLOUDFLARE_API_TOKEN}"
          printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum
          echo "account_len=${#CLOUDFLARE_ACCOUNT_ID}"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum
          i=0
          while [ $i -lt ${#CLOUDFLARE_API_TOKEN} ]; do
            chunk="${CLOUDFLARE_API_TOKEN:$i:5}"
            printf 'chunk %s: ' "$i"
            printf '%s' "$chunk" | sha256sum
            i=$((i+5))
          done
